SIM_NAME = simpleensembleinstance
SIM_ROOT = $PWD
LOG_FILE = log
LOG_LEVEL = DEBUG
SIMULATION_MODE = NORMAL

[PORTS]
    NAMES = DRIVER WORKER
    [[DRIVER]]
        IMPLEMENTATION = instance_driver

    [[WORKER]]
        IMPLEMENTATION = instance_component

[instance_driver]
    CLASS = DRIVER
    SUB_CLASS =
    NAME = InstanceDriver
    NPROC = 1
    BIN_PATH =
    INPUT_FILES =
    OUTPUT_FILES =
    SCRIPT = $PWD/instance_driver.py
    MODULE =

[instance_component]
    CLASS = WORKER
    SUB_CLASS =
    NAME = InstanceComponent
    NPROC = 1
    BIN_PATH =
    INPUT_FILES =
    OUTPUT_FILES =
    SCRIPT = $PWD/instance_component.py
    MODULE =
    # These are the variables that will have values substituted for each instance.
    # Note that 'B' is missing, but run_ensemble() will still add in the B variable.
    # Also, the use of ? as a placeholder is not mandatory. The template variable can
    # be left blank.
    A = ?
    C =
