SIM_ROOT = $PWD/sim
SIM_NAME = sim
LOG_FILE = sim.log
LOG_LEVEL = DEBUG
SIMULATION_MODE = NORMAL
RUN_COMMENT = From PC
RUN_ID = sim run id
TOKAMAK_ID = tokamak
SHOT_NUMBER = 1
TAG = tag
INPUT_DIR = $SIM_ROOT/input_dir/

USER_W3_DIR = $PWD/www
USER_W3_BASEURL =

PORTAL_URL = https://lb.ipsportal.development.svc.spin.nersc.org
#PORTAL_URL = http://localhost:5000
# NOTE: you should not commit the value of PORTAL_API_KEY directly to source control
PORTAL_API_KEY = changeme

STATE_FILES = state.json
STATE_WORK_DIR = $SIM_ROOT/state

[PORTS]
    NAMES = DRIVER WORKER MONITOR

    [[DRIVER]]
        IMPLEMENTATION = driver

    [[WORKER]]
        IMPLEMENTATION = worker

    [[MONITOR]]
        IMPLEMENTATION = monitor

[driver]
    CLASS = DRIVER
    SUB_CLASS =
    NAME = Driver
    NPROC = 1
    BIN_PATH =
    OUTPUT_FILES =
    INPUT_FILES =
    SCRIPT = $PWD/component_driver.py

[worker]
    CLASS = WORKER
    SUB_CLASS =
    NAME = Worker
    NPROC = 1
    BIN_PATH =
    OUTPUT_FILES =
    INPUT_FILES =
    SCRIPT = $PWD/component_worker.py

[monitor]
    CLASS = WORKER
    SUB_CLASS =
    NAME = Monitor
    NPROC = 1
    BIN_PATH =
    OUTPUT_FILES =
    INPUT_FILES =
    SCRIPT = $PWD/component_monitor.py

[TIME_LOOP]
    MODE = REGULAR
    START = 1
    FINISH = 30
    NSTEP = 30
