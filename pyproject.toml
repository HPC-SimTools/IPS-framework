[project]
name = "ipsframework"
dynamic = ["version"]
description = 'Integrated Plasma Simulator (IPS) Framework'
readme = { text = """# Integrated Plasma Simulator (IPS) Framework

The IPS was originally developed for the SWIM project and is designed
for coupling plasma physics codes to simulate the interactions of
various heating methods on plasmas in a tokamak. The physics goal of
the project is to better understand how the heating changes the
properties of the plasma and how these heating methods can be used to
improve the stability of plasmas for fusion energy production.

The IPS framework is thus designed to couple standalone codes flexibly
and easily using python wrappers and file-based data coupling. These
activities are not inherently plasma physics related and the IPS
framework can be considered a general code coupling framework. The
framework provides services to manage:

 - the orchestration of the simulation through component invocation,
    task launch and asynchronous event notification mechanisms
 - configuration of complex simulations using familiar syntax
 - file communication mechanisms for shared and internal (to a
    component) data, as well as checkpoint and restart capabilities

The framework performs the task, configuration, file and resource
management, along with the event service, to provide these features.
""", content-type = "text/markdown" }
license = { file = "LICENSE" }
classifiers = [
  'Programming Language :: Python :: 3',
  'Programming Language :: Python :: 3.11',
  'Programming Language :: Python :: 3.12',
  'Programming Language :: Python :: 3.13',
  'Programming Language :: Python :: 3.14',
  'License :: OSI Approved :: BSD License',
  'Operating System :: MacOS :: MacOS X',
  'Operating System :: POSIX :: Linux',
]
requires-python = ">=3.11"
dependencies = [
  "urllib3",
  "configobj",
  "psutil",
  "rich",      # for advanced output formatting/logging
  # CHECK DASK VERSIONS ON NERSC PERLMUTTER - this is what matters
  "dask",
  #"dask==2022.10.0",
  #"dask==2023.12.1", # TODO need a version compatible with 3.8
  "distributed",
]

[dependency-groups]
dev = [
  "codespell>=2.4.1",
  "mypy>=1.15.0",
  "pre-commit>=4.2.0",
  "pytest>=9.0.3",
  "pytest-cov>=6.1.0",
  "pytest-timeout>=2.4.0",
  "ruff==0.16.0",
]

[project.optional-dependencies]
# sphinx for making docs locally; matplotlib because some of the
# examples generate figures.
docs = ["sphinx", "sphinx_rtd_theme", "matplotlib"]

[project.scripts]
"ips.py" = "ipsframework.ips:main"
"ips" = "ips:main"
"ips_dakota_dynamic.py" = "ipsframework.ips_dakota_dynamic:main"
"ips_dakota_client.py" = "ipsframework.ips_dakota_client:main"

[project.urls]
Documentation = 'https://ips-framework.readthedocs.io'
Homepage = "https://ips-framework.readthedocs.io"
Source = 'https://github.com/HPC-SimTools/IPS-framework'
Tracker = 'https://github.com/HPC-SimTools/IPS-framework/issues'

[build-system]
requires = ["setuptools>=61.0", "setuptools-scm", "versioneer[toml]"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = { find = {} }
zip-safe = true

[tool.versioneer]
VCS = "git"
style = "pep440"
versionfile_source = "ipsframework/_version.py"
versionfile_build = "ipsframework/_version.py"
tag_prefix = "v"
parentdir_prefix = "ipsframework-"

[tool.coverage.report]
include = ["ipsframework/*.py"]
omit = [
  # ignore external copied dependencies
  "*/_version.py",
  "*/utils/HTML.py",
]

[tool.ruff]
line-length = 100
format = { quote-style = 'single' }
extend-exclude = [
  "components/*",
  "doc/*",
  "versioneer.py",
  "ipsframework/_version.py",
  "ipsframework/utils",
]

# TODO - gradually uncomment these as they are fixed
[tool.ruff.lint]
isort = { known-first-party = ['ipsframework'] }
#pydocstyle = { convention = 'google' }
flake8-quotes = { inline-quotes = 'single', multiline-quotes = 'double' }
mccabe = { max-complexity = 45 }                                                          # TODO drop this to 20
pylint = { max-positional-args = 15, max-args = 10, max-branches = 20, max-returns = 10 }
# pyflakes and the relevant pycodestyle rules are already configured
extend-select = [
  'C90', # mccabe complexity
  'I',   # isort
  'N',   # pep8-naming
  #'D',     # pydocstyle
  #'UP',    # pyupgrade
  #'YTT',   # flake8-2020
  #'ANN',   # flake8-annotations
  #'ASYNC', # flake8-async
  #'S',     # flake8-bandit
  #'BLE',   # flake8-blind-except
  'B', # flake8-bugbear
  #'A',     # flake8-builtins
  'COM', # flake8-commas
  'C4',  # flake8-comprehensions
  #'DTZ',   # flake8-datetimez
  #'T10',   # flake8-debugger
  #'EM',    # flake8-error-message
  #'FA',    # flake8-future-annotations
  #'ISC',   # flake8-implicit-string-concat
  #'ICN',   # flake8-import-conventions
  #'G',     # flake8-logging-format
  #'INP',   # flake8-no-pep420
  #'PIE',   # flake8-PIE
  #'T20',   # flake8-T20
  #'PYI',   # flake8-pyi
  #'PT',    # flake8-pytest-style
  'Q', # flake8-quotes
  #'RSE',   # flake8-raise
  #'RET',   # flake8-return
  #'SLF',   # flake8-self
  #'SLOT',  # flake8-slots
  #'SIM',   # flake8-simplify
  #'TCH',   # flake8-type-checking
  #'ARG',   # flake8-unused-arguments
  #'PTH',   # flake8-use-pathlib
  #'PGH',   # pygrep-hooks
  'PL', # pylint
  #'TRY',   # tryceratops
  'FLY', # flynt
  'RUF', # RUFF additional rules
]
# If you're seeking to disable a rule, first consider whether the rule is overbearing, or if it should only be turned off for your usecase.
ignore = [
  ### TODO move these to extend-select when ready
  'D',     # pydocstyle
  'UP',    # pyupgrade
  'YTT',   # flake8-2020
  'ANN',   # flake8-annotations
  'ASYNC', # flake8-async
  'S',     # flake8-bandit
  'BLE',   # flake8-blind-except
  'A',     # flake8-builtins
  'DTZ',   # flake8-datetimez
  'T10',   # flake8-debugger
  'EM',    # flake8-error-message
  'FA',    # flake8-future-annotations
  'ISC',   # flake8-implicit-string-concat
  'ICN',   # flake8-import-conventions
  'G',     # flake8-logging-format
  'INP',   # flake8-no-pep420
  'PIE',   # flake8-PIE
  'T20',   # flake8-T20
  'PYI',   # flake8-pyi
  'PT',    # flake8-pytest-style
  'RSE',   # flake8-raise
  'RET',   # flake8-return
  'SLF',   # flake8-self
  'SLOT',  # flake8-slots
  'SIM',   # flake8-simplify
  'TCH',   # flake8-type-checking
  'ARG',   # flake8-unused-arguments
  'PTH',   # flake8-use-pathlib
  'PGH',   # pygrep-hooks
  'TRY',   # tryceratops
  ### things we actually want to ignore are below here ###
  'COM812',  # formatter, handled by Ruff format
  'ISC001',  # formatter, handled by Ruff format
  'SIM105',  # "with contextlib.suppress():" is slower than try-except-pass
  'ANN401',  # allow explicit "Any" typing, use with care
  'PLR2004', # allow "magic numbers"
  'PLR0911', # allow "too many return statements"
  'PLR0912', # allow "too many branches",
  'PLR0913', # allow "too many arguments in function definition"
  'PLR0915', # allow "too many statements"
]

[tool.ruff.lint.extend-per-file-ignores]
'__init__.py' = ['F401'] # __init__.py commonly has unused imports
'doc/*' = [
  'D',      # the documentation folder does not need documentation
  'INP001', # docs are not a namespace package
]
'examples-proposed/*' = [
  'N999',   # module names for examples are not standard
  'T20',    # allow print/pprint statements in examples
  'S106',   # don't care about credentials in examples
  'D100',   # documenting modules in examples is unhelpful
  'D104',   # documenting packages in examples is unhelpful
  'TRY002', # examples can raise their own exception
]
'examples-proposed/*.ipynb' = [
  'F821', # most notebooks will have an "ips_api" variable predefined, this will be fed in from the IPS framework
]
'tests/*' = [
  'S101',   # allow assert statements in tests
  'S106',   # don't care about credentials in tests
  'SLF001', # allow private member access in tests
  'ANN201', # don't need to annotate return types in tests
  'ARG',    # allow unused parameters in tests
  'D',      # ignore documentation in tests
]

[tool.codespell]
skip = 'RUS,CITATION,_version.py,versioneer.py'
